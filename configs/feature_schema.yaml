# =============================================================================
# THIRD EYE — PARTIALLY AGREED SPRINT 2 CONTRACT (not frozen)
# =============================================================================
# This is the contract between:
#   - Shashank's training harness (produces these values per candidate update)
#   - Mahitha's forecaster models (H1 baseline, Third Eye-Direct, Dynamics)
#
# Rule: semantic/layout changes require joint review and versioning.
# This partial revision is not a freeze or permission to alter Sprint 1.
#
# "per_candidate" features are computed once per candidate update U_t^k.
# "per_state" features are computed once per recursive state S_t and shared
# across all K=3 candidates at that state.
# =============================================================================

schema_version: "0.2-sprint2"
frozen_on: null   # Remaining decisions are unresolved; no freeze by this revision.
# Accepted by current user instruction: D01/D02/D04/D05/D13/D15.
# Explicit revisions: D03 measured caps, D10 applied H1, D11 shared sibling draw.
# Other definitions remain pending. Field order/dtypes/shapes are unchanged.
# Core: T=5 decisions S_0..S_4, ending at applied S_5; K=3, H=2.

# -----------------------------------------------------------------------------
# 1. CURRENT-STATE PERFORMANCE (per_state)
# -----------------------------------------------------------------------------
current_state_performance:
  scope: per_state
  fields:
    - name: target_val_accuracy
      dtype: float32
      shape: [1]
      description: Current model's accuracy on target-task validation split.
    - name: ood_proxy_accuracy
      dtype: float32
      shape: [1]
      description: Current model's accuracy on a cheap OOD proxy subset.
    - name: retention_anchor_accuracy
      dtype: float32
      shape: [1]
      description: Current model's accuracy on the fixed 256-example retention anchor.
    - name: gen_confidence_mean
      dtype: float32
      shape: [1]
      description: Mean generation confidence (e.g. mean token logprob) over a probe set.
    - name: gen_confidence_std
      dtype: float32
      shape: [1]
      description: Std of generation confidence over the same probe set.

# -----------------------------------------------------------------------------
# 2. CANDIDATE DATA STATISTICS (per_candidate)
# -----------------------------------------------------------------------------
candidate_data_stats:
  scope: per_candidate
  fields:
    - name: token_length_mean
      dtype: float32
      shape: [1]
    - name: token_length_std
      dtype: float32
      shape: [1]
    - name: pre_update_nll
      dtype: float32
      shape: [1]
      description: Mean NLL of the current model on the candidate batch before update.
    - name: mean_confidence
      dtype: float32
      shape: [1]
      description: Mean model confidence on its own corrected answers in this batch.
    - name: verifier_pass_rate
      dtype: float32
      shape: [1]
      description: Fraction of attempted corrections that passed the deterministic verifier.
    - name: difficulty_proxy
      dtype: float32
      shape: [1]
      description: Proxy difficulty score (e.g. original failure rate on these examples).
    - name: embedding_diversity
      dtype: float32
      shape: [1]
      description: Mean pairwise cosine distance of example embeddings in the batch.
    - name: duplicate_rate
      dtype: float32
      shape: [1]
      description: Fraction of near-duplicate examples in the batch.

# -----------------------------------------------------------------------------
# 3. GRADIENT / INTERFERENCE STATISTICS (per_candidate)
# -----------------------------------------------------------------------------
gradient_interference_stats:
  scope: per_candidate
  fields:
    - name: grad_norm
      dtype: float32
      shape: [1]
      description: L2 norm of the LoRA gradient on the candidate batch.
    - name: grad_cosine_retention
      dtype: float32
      shape: [1]
      description: Cosine similarity between candidate gradient and a small retention-anchor gradient.
    - name: layerwise_grad_norms
      dtype: float32
      shape: [num_lora_layers]     # Explicit count of adapted modules; never inferred from rank.
      description: One joint A/B gradient norm per adapted module, numeric block order then explicit target placement order.
    - name: sign_agreement
      dtype: float32
      shape: [1]
      description: Fraction of LoRA parameters where candidate-grad and retention-grad signs agree.

# -----------------------------------------------------------------------------
# 4. SHORT-PROBE DYNAMICS (per_candidate) — from a 10-20 step probe run
# -----------------------------------------------------------------------------
short_probe_dynamics:
  scope: per_candidate
  probe_steps: 15        # Still proposed (D12), not execution approval.
  fields:
    - name: train_loss_slope
      dtype: float32
      shape: [1]
      description: Linear-fit slope of training loss over the probe steps.
    - name: anchor_loss_slope
      dtype: float32
      shape: [1]
      description: Linear-fit slope of loss on retention-anchor prompts over the probe steps.
    - name: kl_drift_anchor
      dtype: float32
      shape: [1]
      description: KL divergence between pre-probe and post-probe output distributions on anchor prompts.
    - name: lora_delta_norm
      dtype: float32
      shape: [1]
      description: L2 norm of LoRA weight change after the probe.
    - name: val_loss_slope
      dtype: float32
      shape: [1]
      description: Linear-fit slope of a small target-validation loss sample over the probe steps.

# -----------------------------------------------------------------------------
# 5. RECURSIVE HISTORY (per_state) — last 1-3 rounds, padded if fewer exist
# -----------------------------------------------------------------------------
recursive_history:
  scope: per_state
  history_len: 3          # pad with zeros + mask for t < 3
  fields:
    - name: prev_accepted_value
      dtype: float32
      shape: [history_len]
      description: Applied observed H1 utility, 0.50 target + 0.25 OOD + 0.25 retention H1 accuracy deltas; never an H2 label or forecast.
    - name: current_gen_index
      dtype: int32
      shape: [1]
      description: t, the current recursive generation index (0-indexed).
    - name: prev_target_change
      dtype: float32
      shape: [history_len]
      description: Observed applied t+1 target accuracy minus that update's parent accuracy; last min(t,3) rounds, oldest first, left zero padding.
    - name: prev_ood_change
      dtype: float32
      shape: [history_len]
      description: Observed applied t+1 OOD accuracy minus that update's parent accuracy.
    - name: prev_retention_change
      dtype: float32
      shape: [history_len]
      description: Observed applied t+1 retention accuracy minus that update's parent accuracy.
    - name: history_mask
      dtype: float32
      shape: [history_len]
      description: 1.0 for each required observed applied H1 row, 0.0 only for absent pre-trajectory padding; missing applied results must fail, not pad.

# -----------------------------------------------------------------------------
# LABELS (meta-labels, per_candidate) — produced only during expensive labeling
# runs; used to train the forecasters, never available at inference/ranking time.
# -----------------------------------------------------------------------------
labels:
  scope: per_candidate
  fields:
    - name: delta_target_h1
      dtype: float32
      shape: [1]
      description: Target t+1 accuracy minus current parent accuracy, fractions and positive for improvement; label only.
    - name: delta_target_h2
      dtype: float32
      shape: [1]
      description: Target t+2 accuracy minus current parent accuracy under one standardized sibling continuation draw.
    - name: delta_ood_h2
      dtype: float32
      shape: [1]
      description: OOD t+2 accuracy minus current parent accuracy, fractions.
    - name: delta_retention_h2
      dtype: float32
      shape: [1]
      description: Retention t+2 accuracy minus current parent accuracy, fractions.
    - name: lhv2
      dtype: float32
      shape: [1]
      description: 0.50 delta_target_h2 + 0.25 delta_ood_h2 + 0.25 delta_retention_h2; label/ranking only, strictly H2.

# -----------------------------------------------------------------------------
# DERIVED DIMENSIONS (computed at load time, not hand-edited)
# -----------------------------------------------------------------------------
derived:
  static_candidate_feature_dim: >
    sum of shapes in candidate_data_stats + gradient_interference_stats
    + short_probe_dynamics (num_lora_layers explicitly bound by actual module manifest)
  static_state_feature_dim: >
    sum of shapes in current_state_performance
  history_feature_dim: >
    sum of shapes in recursive_history (excluding current_gen_index, which is
    typically embedded or normalized separately)
